version = 1
ir = "flat"
name = "base-modelica"
description = "Base Modelica (MCP-0031) interchange output from flat IR"
readiness_level = 0
execution_mode = "source-transform"
deployment_class = "modelica"

# The template renders `when` chains (with `reinit`, discrete assignments,
# `if` branches, `assert`/`terminate`), algorithm and initial algorithm
# sections, and the user functions the model calls, so events and algorithms
# keep their default (supported).

[[files]]
path = "{{ model_name }}.bmo"
template = "base_modelica.mo.jinja"
shared_as = "base-modelica.bmo.jinja"
